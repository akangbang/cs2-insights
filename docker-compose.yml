# Local PostgreSQL for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: decision_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d decision_tracker"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
